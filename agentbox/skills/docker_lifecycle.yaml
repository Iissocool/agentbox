name: docker_lifecycle
layer: system

capabilities:
  - create_container
  - start_container
  - stop_container
  - remove_container
  - build_image
  - commit_container

constraints:
  - Must use agentbox-base as parent image
  - Must mount project to /workspace
  - Must set resource limits (memory, cpu)
  - Must label containers with agentbox metadata

tools_allowed:
  - docker

output_format:
  - container_info_json
  - build_log